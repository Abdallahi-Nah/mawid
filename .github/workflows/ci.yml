name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mawid
          POSTGRES_PASSWORD: mawid
          POSTGRES_DB: mawid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mawid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      # Test values only (not secrets). The API integration tests use this database.
      DATABASE_URL: postgresql://mawid:mawid@localhost:5432/mawid
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-chars
      MAIL_FROM: Mawid <no-reply@example.com>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Browser tests (Playwright + Chrome) on a freshly built stack: registration, booking in ar and fr at 360 px,
  # cancel by link, owner calendar, AI chat with a mocked Groq, plan limits, accessibility.
  e2e:
    runs-on: ubuntu-latest
    needs: ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mawid
          POSTGRES_PASSWORD: mawid
          POSTGRES_DB: mawid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mawid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mawid:mawid@localhost:5432/mawid
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: bash scripts/e2e-ci.sh
      - name: Keep the server logs and screenshots of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            /tmp/e2e-api.log
            /tmp/e2e-web.log
            /tmp/mawid-*-shots/
          if-no-files-found: ignore

  # The production image must keep building: it is what Railway, Render or a VPS runs (docs/DEPLOY.md).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: mawid-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image starts, applies the migrations and answers
        run: |
          docker network create ci
          docker run -d --name pg --network ci -e POSTGRES_USER=mawid -e POSTGRES_PASSWORD=mawid -e POSTGRES_DB=mawid postgres:16
          docker run -d --name redis --network ci redis:7
          for i in $(seq 1 30); do docker exec pg pg_isready -U mawid && break; sleep 2; done
          docker exec pg psql -U mawid -d mawid -c "CREATE EXTENSION IF NOT EXISTS btree_gist"
          docker run -d --name api --network ci -p 4000:4000 \
            -e DATABASE_URL=postgresql://mawid:mawid@pg:5432/mawid -e REDIS_URL=redis://redis:6379 \
            -e APP_URL=http://localhost:3000 -e API_URL=http://localhost:4000 \
            -e JWT_SECRET=ci-only-jwt-secret-at-least-32-characters \
            -e JWT_REFRESH_SECRET=ci-only-refresh-secret-at-least-32-chars \
            -e MAIL_FROM="Mawid <no-reply@example.com>" mawid-api:ci
          for i in $(seq 1 40); do curl -fs localhost:4000/health/ready && break; sleep 3; done
          curl -fs localhost:4000/health/ready || (docker logs api; exit 1)
          # SIGTERM: Nest closes the app (jobs finish, Redis and the database close) and then re-sends the signal,
          # so a graceful stop ends with code 143 (or 0). 137 would mean docker had to kill it (SIGKILL).
          docker stop -t 20 api
          code="$(docker inspect api --format '{{.State.ExitCode}}')"
          echo "exit code: $code"
          if [ "$code" != "0" ] && [ "$code" != "143" ]; then docker logs api; exit 1; fi

