name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mawid
          POSTGRES_PASSWORD: mawid
          POSTGRES_DB: mawid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mawid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      # Test values only (not secrets). The API integration tests use this database.
      DATABASE_URL: postgresql://mawid:mawid@localhost:5432/mawid
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-chars
      MAIL_FROM: Mawid <no-reply@example.com>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
