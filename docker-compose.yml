services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mawid
      POSTGRES_PASSWORD: mawid
      POSTGRES_DB: mawid
    ports: ['5434:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mawid']
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
volumes:
  pgdata:
